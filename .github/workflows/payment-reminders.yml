# Triggers the payment-reminder endpoint 3x daily (Vercel Hobby crons are
# limited to once per day, so extra runs are driven from GitHub Actions).
# Requires two repository secrets:
#   APP_URL     — e.g. https://tbcooz-finance.com
#   CRON_SECRET — same value as the CRON_SECRET env var on Vercel
name: Payment reminders (3x daily)

on:
  schedule:
    - cron: '0 8 * * *'   # 09:00 WAT
    - cron: '0 12 * * *'  # 13:00 WAT
    - cron: '0 16 * * *'  # 17:00 WAT
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call payment-reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL%/}"          # strip trailing slash if any
          APP_URL="$(echo -n "$APP_URL")" # strip trailing whitespace/newlines
          if [ -z "$APP_URL" ]; then echo "::error::APP_URL secret is not set"; exit 1; fi
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/payment-reminders"
